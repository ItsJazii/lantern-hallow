		<script>
// The game data is hosted as numbered parts (each under the host's file-size limit).
// Godot fetches "index.pck"; this joins the parts back into one stream on the fly.
(function () {
	const PARTS = __PARTS__;
	const realFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		if (!/(^|\/)index\.pck(\?|$)/.test(url)) {
			return realFetch(input, init);
		}
		return realFetch('index.pck.part0').then(function (first) {
			if (!first.ok) {
				return first;
			}
			let next = 1;
			let reader = first.body.getReader();
			const stream = new ReadableStream({
				pull: function (controller) {
					return reader.read().then(function (chunk) {
						if (!chunk.done) {
							controller.enqueue(chunk.value);
							return;
						}
						if (next >= PARTS) {
							controller.close();
							return;
						}
						return realFetch('index.pck.part' + next++).then(function (res) {
							if (!res.ok) {
								throw new Error('Failed loading game data part ' + (next - 1));
							}
							reader = res.body.getReader();
							return this.pull(controller);
						}.bind(this));
					}.bind(this));
				},
			});
			return new Response(stream, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
		});
	};
})();
		</script>
